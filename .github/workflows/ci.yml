# CI: the test suite on every PR and on main. Its job name, "pytest", is a required check for merging (ops/github-setup.sh).
# Written by the human during setup. Agents can't change it: their token has no `workflow` scope.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"     # the VM's Python (Ubuntu 24.04)
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Test
        run: |
          set +e
          python -m pytest -q
          rc=$?
          if [ "$rc" -eq 5 ]; then echo "No tests collected yet."; exit 0; fi
          exit "$rc"
